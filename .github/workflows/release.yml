name: Signed Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source and native dependencies
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android native toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Restore release signing material
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          mkdir -p release
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release/mint-ai-recorder-release.jks
          {
            printf 'storeFile=release/mint-ai-recorder-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Test, lint, and build signed release
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            :app:bundleRelease \
            --no-daemon

      - name: Verify release security and 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          build_tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          readelf="$ANDROID_SDK_ROOT/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/zipalign" -c -P 16 4 "$apk"

          if apkanalyzer manifest print "$apk" | grep -q 'android:debuggable="true"'; then
            echo "Release APK is debuggable" >&2
            exit 1
          fi

          native_dir="$(mktemp -d)"
          trap 'rm -rf "$native_dir"' EXIT
          unzip -q "$apk" 'lib/arm64-v8a/*.so' -d "$native_dir"
          failed=0
          while IFS= read -r -d '' library; do
            while read -r alignment; do
              if (( alignment < 0x4000 )); then
                echo "Native library is not 16 KB aligned: $library ($alignment)" >&2
                failed=1
              fi
            done < <("$readelf" -lW "$library" | awk '$1 == "LOAD" { print $NF }')
          done < <(find "$native_dir" -name '*.so' -print0)
          test "$failed" -eq 0

      - name: Create SHA-256 checksums
        shell: bash
        run: |
          sha256sum app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab > release-checksums.sha256

      - name: Upload signed release files
        uses: actions/upload-artifact@v7
        with:
          name: mint-ai-recorder-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            release-checksums.sha256
          if-no-files-found: error
          retention-days: 30
